name: CI PAYFLOW
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixa o código
        uses: actions/checkout@v7

      - name: Instala o Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Confere formatação
        run: ./mvnw -B spotless:check

      - name: Compila e roda os testes
        run: ./mvnw -B verify

      - name: Salva os relatórios de teste
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-de-teste
          path: |
            target/surefire-reports/
            target/failsafe-reports/
  gitleaks:
    runs-on: ubuntu-latest

    steps:
      - name: Baixa o código com todo o histórico
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Procura segredos commitados
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN}}